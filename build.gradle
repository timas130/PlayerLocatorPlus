plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.0'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/player-locator-plus.classtweaker")
    splitEnvironmentSourceSets()

    mods {
        "player-locator-plus" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

configurations {
    includeAndExpose

    modApi {
        extendsFrom includeAndExpose
    }
    include {
        extendsFrom includeAndExpose
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "net.fabricmc:fabric-language-kotlin:1.13.12+kotlin.2.4.0"


// Cloth Config API
    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // Mod Menu
    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}")
    localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}")
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'


//    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.4.0")
//    implementation("org.jetbrains.kotlinx:kotlinx-datetime-jvm:0.8.0")

    // Better TOML serializer
    // RANT: So basically Toml4j, the library auto config uses to serialize configs in TOML,
    //       only supports an ancient version of the spec: TOML 0.4.0. This version is so old it
    //       does NOT support hexadecimal numbers, which makes it very hard to specify colors
    //       in the config. So we opt for a better library that actually implements the latest
    //       version of the format.
    include implementation("com.akuleshov7:ktoml-core-jvm:0.7.1")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {

    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
